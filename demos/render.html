<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sublevel: renderer demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;

        position: fixed;
        left: 8px;
        top: 8px;
        color: #9f9;

        white-space: pre;
      }

  <body>
    <canvas id="view"></canvas>
    <div id="overlay">starting</div>
